# ============================================================
# TeamForge AI - SonarQube Project Configuration
# ============================================================

sonar.projectKey=teamforge-ai
sonar.projectName=TeamForge AI
sonar.projectVersion=1.0

# ------------------------------------------------------------
# Source and test locations
# ------------------------------------------------------------

sonar.sources=src
sonar.tests=tests

sonar.test.inclusions=tests/**/*.test.js

# ------------------------------------------------------------
# Jest coverage
# ------------------------------------------------------------

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ------------------------------------------------------------
# Generated/vendor exclusions
# ------------------------------------------------------------

sonar.exclusions=\
node_modules/**,\
coverage/**,\
test-results/**,\
public/**

sonar.coverage.exclusions=\
src/server.js

# ------------------------------------------------------------
# Encoding
# ------------------------------------------------------------

sonar.sourceEncoding=UTF-8
