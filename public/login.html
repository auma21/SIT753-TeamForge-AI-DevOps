<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Sign in · TeamForge AI</title>
    <link href="/favicon.ico" rel="icon" type="image/x-icon" />
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png" />
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="/favicon-48x48.png" rel="icon" sizes="48x48" type="image/png" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <link
      href="/android-chrome-192x192.png"
      rel="icon"
      sizes="192x192"
      type="image/png"
    />
    <link
      href="/android-chrome-512x512.png"
      rel="icon"
      sizes="512x512"
      type="image/png"
    />
    <meta content="#0e5699" name="theme-color" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                50: "#ebf3fe",
                100: "#d5e6fd",
                500: "#1877F2",
                600: "#1462c7",
                700: "#0d4da1",
              },
              used: { bg: "#EDF9F0", accent: "#389E73", text: "#175438" },
              notused: { bg: "#FDEEEE", accent: "#D15359", text: "#7e2328" },
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .grid-paper-bg {
        background-size: 24px 24px;
        background-image:
          linear-gradient(
            to right,
            rgba(226, 232, 240, 0.5) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(226, 232, 240, 0.5) 1px,
            transparent 1px
          );
      }
    </style>
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <nav class="shell nav">
        <a class="brand" href="/"
          ><img
            alt="TeamForge AI"
            class="brand-logo"
            src="/teamforge-logo.png"
          />TeamForge AI</a
        >
        <div class="navlinks"><a href="/register.html">Create account</a></div>
      </nav>
    </header>
    <main class="shell auth-wrap">
      <section class="card auth-card">
        <div class="eyebrow">Welcome back</div>
        <h2>Sign in to TeamForge AI</h2>
        <p class="muted">Access your projects and Agile backlog.</p>
        <div class="message" id="message"></div>
        <form class="form-grid" data-auth-form="login">
          <div class="field">
            <label for="email">Email</label
            ><input
              autocomplete="email"
              id="email"
              name="email"
              required=""
              type="email"
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              autocomplete="current-password"
              id="password"
              name="password"
              required=""
              type="password"
            />
          </div>
          <button class="btn primary" type="submit">Sign in</button>
        </form>
        <p class="muted">
          New to TeamForge? <a href="/register.html">Create an account</a>.
        </p>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <footer class="shell footer">
      © 2026 TeamForge AI · SIT753 All rights reserved.
    </footer>
  </body>
</html>
