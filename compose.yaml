# ============================================================
# TeamForge AI - Base Docker Compose Configuration
# ============================================================
#
# Shared architecture for:
#   - local
#   - staging
#   - production
#   - Jenkins CI/CD
#
# Environment-specific configuration is supplied through
# environment files and small Compose overlays.
# ============================================================

services:

  # ==========================================================
  # PostgreSQL Database
  # ==========================================================

  postgres:

    # TeamForge PostgreSQL image containing the version-controlled
    # database initialization schema.
    build:
      context: ./database
      dockerfile: Dockerfile

    # IMAGE_TAG allows the same immutable database image to move
    # through staging and production.
    image: teamforge-postgres:${IMAGE_TAG:-local}

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # Named volume only.
    #
    # No Windows/OneDrive host bind mount is required.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # PostgreSQL must accept connections before the API starts.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - teamforge-network

    # PostgreSQL deliberately has no host port mapping.
    #
    # The API reaches it through Docker's private network at:
    #
    #   postgres:5432


  # ==========================================================
  # TeamForge AI API
  # ==========================================================

  api:

    # Local deployments may build directly from source.
    #
    # Jenkins staging/production deployment will use --no-build
    # to promote the exact previously built and scanned image.
    build:
      context: .
      dockerfile: Dockerfile

    # Example CI image:
    #
    #   teamforge-ai:git-a1b2c3d
    #
    image: teamforge-ai:${IMAGE_TAG:-local}

    restart: unless-stopped

    environment:

      # -------------------------------------------------------
      # Runtime
      # -------------------------------------------------------

      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}

      # -------------------------------------------------------
      # PostgreSQL
      # -------------------------------------------------------

      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # -------------------------------------------------------
      # Authentication
      # -------------------------------------------------------

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

      # -------------------------------------------------------
      # Client / CORS
      # -------------------------------------------------------

      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}

    # The container always listens on 3000.
    #
    # Host examples:
    #
    #   local       3000 -> 3000
    #   staging     3001 -> 3000
    #   production  3000 -> 3000
    #
    ports:
      - "${API_HOST_PORT:-3000}:3000"

    # Do not start the API until PostgreSQL is healthy.
    depends_on:
      postgres:
        condition: service_healthy

    # Application-level health check.
    #
    # Node's built-in fetch avoids installing curl/wget in the
    # hardened production image.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - teamforge-network


# ============================================================
# Persistent Storage
# ============================================================
#
# "postgres-data" is the fixed logical Compose volume key.
#
# DB_VOLUME_NAME changes its physical Docker volume name:
#
#   local:
#     teamforge-postgres-data
#
#   staging:
#     teamforge-postgres-staging
#
#   production:
#     teamforge-postgres-production
# ============================================================

volumes:

  postgres-data:
    name: ${DB_VOLUME_NAME:-teamforge-postgres-data}


# ============================================================
# Internal Docker Network
# ============================================================

networks:

  teamforge-network:
    driver: bridge